# Render (plan gratis) duerme el backend tras 15 minutos sin peticiones y el primer visitante
# espera ~50 s a que arranque. Este workflow lo llama cada 10 minutos para que siga despierto.
#
# Notas:
#  - GitHub puede retrasar los cron unos minutos en horas de mucha carga; 10 min deja margen.
#  - Render gratis da 750 h/mes: mantener UN servicio despierto todo el mes (~744 h) cabe justo.
#  - GitHub pausa los workflows programados de repos públicos tras 60 días sin commits; si pasa,
#    reactívalo en la pestaña Actions.
#  - Para otra URL, crea la variable BACKEND_URL en Settings → Secrets and variables → Actions.
name: Mantener despierto el backend

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Llamar a /api/salud
        # --retry: si justo estaba dormido, la primera llamada puede fallar mientras arranca
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.BACKEND_URL || 'https://portafolio-pandax.onrender.com' }}/api/salud"
